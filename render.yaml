services:
  - type: web
    name: babile-sport-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      # ── Database (Neon — set your connection string) ──────
      - key: DATABASE_URL
        sync: false
      # ── Redis (Upstash — set your REST URL) ──────────────
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # ── Auth ──────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # ── Admin Seed (auto-created on first startup) ────────
      - key: ADMIN_EMAIL
        value: "admin@babile.com"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_DISPLAY_NAME
        value: "Admin Operator"
      # ── App ───────────────────────────────────────────────
      - key: PORT
        value: "8000"
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: "production"
      - key: CORS_ORIGINS
        value: "*"
      - key: FRONTEND_URL
        value: "https://babilesport.vercel.app"
      # ── ImageKit ──────────────────────────────────────────
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
    healthCheckPath: /health
