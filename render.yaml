services:
  - type: web
    name: babile-sport-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: babile-sport-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: babile-sport-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: "admin@babile.com"
      - key: ADMIN_PASSWORD
        value: "Admin@123"
      - key: ADMIN_DISPLAY_NAME
        value: "Admin Operator"
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: FRONTEND_URL
        value: "https://babilesport.vercel.app"
      - key: PORT
        value: "8000"
    healthCheckPath: /health

databases:
  - name: babile-sport-db
    engine: postgres
    plan: starter
